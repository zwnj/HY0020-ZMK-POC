---
include:
    - board: hy0020
      shield: hy73_left
      cmake-args: -DCONFIG_ZMK_STUDIO=y
      artifact-name: hy73_left_studio

    - board: hy0020
      shield: hy73_right
      artifact-name: hy73_right

    # Zephyr 4.1 Hardware Model v2 uses board/SoC qualifiers.
    - board: nrf52dk/nrf52832
      shield: hy73_left
      cmake-args: -DCONFIG_ZMK_STUDIO=y
      artifact-name: nrf52dk_hy73_left_studio_reference

    - board: nrf52dk/nrf52832
      shield: hy73_right
      artifact-name: nrf52dk_hy73_right_reference
