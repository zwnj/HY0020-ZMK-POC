name: Test current ZMK main

on:
    push:
        paths:
            - ".github/workflows/modern.yml"
            - "boards/**"
            - "config/**"
    workflow_dispatch:

jobs:
    build-current:
        runs-on: ubuntu-latest
        container:
            image: zmkfirmware/zmk-build-arm:stable
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: anna-b402-left-studio
                      board: anna_b402
                      shield: hy73_left
                      cmake_args: -DCONFIG_ZMK_STUDIO=y
                    - name: anna-b402-right
                      board: anna_b402
                      shield: hy73_right
                      cmake_args: ""

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Prepare current-ZMK manifest
              shell: bash
              run: |
                  set -euo pipefail
                  base_dir="${RUNNER_TEMP}/zmk-current-${{ matrix.name }}"
                  build_dir="${RUNNER_TEMP}/build-current-${{ matrix.name }}"
                  mkdir -p "${base_dir}/config" "${build_dir}"
                  cp -R config/. "${base_dir}/config/"
                  sed -i 's/revision: 641514a97db345f499dd50b0360e594270f008fe/revision: main/' "${base_dir}/config/west.yml"
                  echo "BASE_DIR=${base_dir}" >> "${GITHUB_ENV}"
                  echo "BUILD_DIR=${build_dir}" >> "${GITHUB_ENV}"

            - name: West init and update
              shell: bash
              working-directory: ${{ env.BASE_DIR }}
              run: |
                  set -euo pipefail
                  west init -l "${BASE_DIR}/config"
                  west update --fetch-opt=--filter=tree:0
                  west zephyr-export

            - name: Build current ZMK
              shell: bash
              working-directory: ${{ env.BASE_DIR }}
              run: |
                  set -euo pipefail
                  west build \
                      -s zmk/app \
                      -d "${BUILD_DIR}" \
                      -b "${{ matrix.board }}" \
                      -- \
                      -DZMK_CONFIG="${BASE_DIR}/config" \
                      -DSHIELD="${{ matrix.shield }}" \
                      -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE}" \
                      ${{ matrix.cmake_args }} \
                      2>&1 | tee "${BUILD_DIR}/build.log"

            - name: Report memory when build succeeds
              if: success()
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -p "${BUILD_DIR}/reports"
                  python3 "${GITHUB_WORKSPACE}/tools/memory_report.py" \
                      "${BUILD_DIR}/build.log" \
                      --name "current-${{ matrix.name }}" \
                      --json "${BUILD_DIR}/reports/memory.json" \
                      --markdown "${BUILD_DIR}/reports/memory.md"
                  cat "${BUILD_DIR}/reports/memory.md" >> "${GITHUB_STEP_SUMMARY}"

            - name: Preserve logs
              if: always()
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -p "${BUILD_DIR}/reports"
                  test -f "${BUILD_DIR}/build.log" && cp "${BUILD_DIR}/build.log" "${BUILD_DIR}/reports/build.log" || true
                  test -f "${BUILD_DIR}/zephyr/.config" && cp "${BUILD_DIR}/zephyr/.config" "${BUILD_DIR}/reports/kconfig.txt" || true
                  test -f "${BUILD_DIR}/zephyr/zephyr.dts" && cp "${BUILD_DIR}/zephyr/zephyr.dts" "${BUILD_DIR}/reports/zephyr.dts" || true

            - name: Upload diagnostics
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: current-${{ matrix.name }}
                  path: ${{ env.BUILD_DIR }}/reports
